map $uri $welcom_cache {
    default                                   "public, max-age=0, must-revalidate";
    ~*^/_astro/                               "public, max-age=31536000, immutable";
    ~*^/fonts/                                "public, max-age=31536000, immutable";
    ~*^/imgs/                                 "public, max-age=2592000";
    ~*\.(?:css|js|woff2|ttf)$                 "public, max-age=31536000, immutable";
    ~*\.(?:webp|avif|svg|png|jpe?g|gif|ico)$  "public, max-age=2592000";
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    if ($host = www.YOUR_DOMAIN) {
        return 301 https://YOUR_DOMAIN$request_uri;
    }

    root /var/www/welcom;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    sendfile on;
    tcp_nopush on;
    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    add_header Cache-Control            $welcom_cache  always;
    add_header X-Frame-Options          "SAMEORIGIN"   always;
    add_header X-Content-Type-Options   "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /foyer {
        return 302 /foyer/rdc;
    }

    location = /foyer/ {
        return 302 /foyer/rdc;
    }

    location ~ ^/([^/]+)/foyer/?$ {
        return 302 /$1/foyer/rdc;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/manifest+json
        image/svg+xml
        font/ttf;
}
